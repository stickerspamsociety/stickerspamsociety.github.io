<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0b">
<title>Retrobottega</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,500;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0b;color:#f4f4f0;font-family:'Jost','Futura','Century Gothic',sans-serif;font-weight:500;line-height:1.3;padding:16px 16px 96px;max-width:640px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.logo{font-size:20px;font-style:italic;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.logo b{background:#b6ff00;color:#000;padding:0 6px;margin-left:4px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#stat{font-size:13px;color:#9a9a94}#stat.bad{color:#ff7b7b}
.lbl{font-size:12px;color:#9a9a94;letter-spacing:.12em;text-transform:uppercase}
.card{border:2px solid #b6ff00;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card.closed{border-color:#f4f4f0}
.big{font-size:34px;font-style:italic;font-weight:700;line-height:1;margin-top:2px;color:#b6ff00}
.closed .big{color:#f4f4f0}
.sub{font-size:13px;color:#cfcfc9;margin-top:8px}
.sw{width:64px;height:44px;border-radius:22px;border:0;position:relative;flex:none;background:#3a3a37;cursor:pointer}
.sw i{position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:18px;background:#9a9a94;transition:left .15s}
.sw.on{background:#b6ff00}.sw.on i{left:24px;background:#0b0b0b}
.btn{width:100%;height:48px;background:transparent;border:2px solid #f4f4f0;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;margin-bottom:12px}
.btn.lime{background:#b6ff00;border-color:#b6ff00;color:#0b0b0b}
.fld{width:100%;min-height:48px;background:#141414;border:2px solid #3a3a37;padding:0 14px}
textarea.fld{padding:12px 14px;height:84px;resize:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:2px}
.chip{height:44px;padding:0 14px;border:2px solid #3a3a37;background:transparent;font-size:14px;flex:none;cursor:pointer;white-space:nowrap}
.chip.sel{background:#f4f4f0;color:#0b0b0b;border-color:#f4f4f0}
.chip.off{border-color:#b6ff00;color:#b6ff00}.chip.off.sel{background:#b6ff00;color:#0b0b0b}
.item{border-bottom:1px solid #2a2a2a;padding:10px 0}
.row{display:flex;align-items:center;gap:12px}
.th{width:48px;height:48px;background:#fefefe;color:#0b0b0b;display:flex;align-items:center;justify-content:center;font-style:italic;font-weight:700;flex:none;position:relative;overflow:hidden}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.nm{flex:1;font-size:16px;line-height:1.15;min-width:0}
.nm small{display:block;font-size:12px;color:#9a9a94;margin-top:3px}
.offp .nm,.offp .th{opacity:.55}
.vars{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.v{height:44px;padding:0 14px;border:2px solid #3a3a37;background:transparent;color:#9a9a94;text-decoration:line-through;cursor:pointer}
.v.on{background:#b6ff00;border-color:#b6ff00;color:#0b0b0b;text-decoration:none}
.v:disabled{opacity:.35;cursor:default}
.opt{display:block;width:100%;text-align:left;padding:14px;border:2px solid #3a3a37;background:transparent;margin-bottom:8px;cursor:pointer}
.opt b{display:block;font-size:17px;font-style:italic;text-transform:uppercase}
.opt span{font-size:13px;color:#9a9a94}
.opt.sel{border-color:#b6ff00;background:#141414}.opt.sel b{color:#b6ff00}
.pv{background:#fefefe;color:#0b0b0b;margin:6px 0 16px}
.pv div{background:#b6ff00;padding:9px 12px;text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-style:italic;font-weight:700}
.pv p{padding:12px;font-size:14px;color:#66665f}
.bulk{display:flex;gap:8px;margin-top:16px}.bulk .chip{flex:1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#b6ff00;color:#0b0b0b;padding:10px 16px;display:flex;gap:14px;align-items:center;font-weight:700;z-index:9}
#toast button{background:#0b0b0b;color:#b6ff00;border:0;height:44px;padding:0 14px;cursor:pointer;text-transform:uppercase}
#lerr{color:#ff7b7b;font-size:14px;margin:8px 0;min-height:20px}
.rem{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:14px}.rem input{width:22px;height:22px;accent-color:#b6ff00}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;height:48px;border:2px solid #3a3a37;background:transparent;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.tabs button.sel{background:#f4f4f0;color:#0b0b0b;border-color:#f4f4f0}
.info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:12px}
.info span{border:1px solid #3a3a37;padding:4px 8px;color:#9a9a94}
.info span.ok{border-color:#b6ff00;color:#b6ff00}.info span.bad{border-color:#ff7b7b;color:#ff7b7b}
.testbar{background:#ff7b7b;color:#0b0b0b;padding:8px 12px;font-weight:700;font-size:13px;margin-bottom:12px}
.ord{border:2px solid #3a3a37;padding:12px;margin-bottom:12px}
.ord.new{border-color:#b6ff00}.ord.shipped{opacity:.6}
.oh{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#9a9a94}
.oh b{color:#f4f4f0;font-size:15px}
.on{font-size:19px;font-weight:700;font-style:italic;margin:6px 0 2px}
.oi{font-size:15px;margin:6px 0}
.om{font-size:13px;color:#9a9a94}
.ord details{margin:8px 0;font-size:14px;color:#cfcfc9}
.ord summary{cursor:pointer;padding:8px 0;color:#b6ff00}
.ord details p{margin:2px 0}
.sts{display:flex;gap:8px;margin-top:10px}
.sts .chip{flex:1;padding:0 6px}
.sts .chip.sel{background:#b6ff00;color:#0b0b0b;border-color:#b6ff00}
.trk{margin-top:8px;min-height:44px}
.small{height:44px;padding:0 14px;border:2px solid #3a3a37;background:transparent;cursor:pointer;margin:4px 8px 4px 0}
.tabs button{padding:0 4px}
select.fld{padding:0 10px}
.nrow{display:grid;grid-template-columns:1fr 1fr 78px 62px 44px;gap:6px;margin-bottom:6px}
.nrow .fld{padding:0 8px;min-width:0;font-size:14px}
.nrow .small{margin:0;padding:0}
.nres{margin:6px 0 12px}
.nres .chip{display:block;width:100%;text-align:left;margin-bottom:6px;height:auto;min-height:44px;padding:8px 12px;white-space:normal}
pre.ph{background:#141414;border:1px solid #3a3a37;padding:10px;font-size:12px;color:#cfcfc9;white-space:pre-wrap;word-break:break-all;margin:6px 0 14px}
.okbox{border:2px solid #b6ff00;padding:12px;margin-bottom:14px;font-size:14px}
.errbox{color:#ff7b7b;font-size:14px;margin:8px 0;min-height:20px}
.lastx{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2a2a;padding:10px 0}
.lastx span{min-width:0;flex:1}
.secs{border:2px solid #3a3a37;padding:12px 16px;margin-bottom:12px}
.secs .row{justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2a2a}
.secs .row:last-child{border-bottom:0}
.secs .nm.offs{color:#ff7b7b}
.vs{display:inline-flex;gap:4px;align-items:center}
.stk{width:68px;min-height:44px;background:#141414;border:2px solid #3a3a37;padding:0 6px;text-align:center;font-size:14px}
.stk.has{border-color:#b6ff00}
.stk.zero{border-color:#ff7b7b;color:#ff7b7b}
.vs .lbl{margin-right:2px}
.ord.todo{border-color:#ffb000}.ord.problem{border-color:#ff7b7b}.ord.packed{border-color:#7ab8ff}
.badge{display:inline-block;font-size:11px;padding:2px 6px;margin-left:6px;border:1px solid #3a3a37;color:#9a9a94;font-style:normal;vertical-align:middle}
.badge.red{border-color:#ff7b7b;color:#ff7b7b}.badge.lime{border-color:#b6ff00;color:#b6ff00}.badge.amb{border-color:#ffb000;color:#ffb000}
.orow{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #2a2a2a;padding:10px 0;font-size:14px}
.orow b{font-size:15px}.orow .om{margin-top:2px}.orow .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-content:flex-start}
.orow .small{margin:0;height:40px}
.shp{display:grid;grid-template-columns:110px 1fr auto;gap:6px;margin-top:8px}
.shp .fld,.shp select{min-height:44px;padding:0 8px;min-width:0}
.shp .small{margin:0}
.meta2{display:grid;grid-template-columns:1fr 140px;gap:6px;margin-top:6px}
.meta2 .fld{min-height:44px;font-size:14px}
.todo{border:2px solid #b6ff00;padding:12px;margin-bottom:12px}
.todo .ti{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #2a2a2a;padding:8px 0;font-size:14px}
.todo .ti:last-child{border-bottom:0}
.tone{display:flex;gap:6px;margin:8px 0 4px}.tone .chip{height:36px;flex:1}
.prep{border:2px solid #7ab8ff;padding:12px;margin-bottom:12px;font-size:15px}
.prep p{margin:3px 0}
a.ig{color:#b6ff00}
.pbox{border:2px solid #ff7b7b;padding:10px;margin:10px 0 0;font-size:14px}.pbox.amb{border-color:#ffb000}
.pacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pacts .small{margin:0;height:40px}
.todo .tg{font-size:13px;font-weight:700;margin:12px 0 2px;color:#f4f4f0}
.todo .ti small{color:#9a9a94;font-size:12px}.todo .ti .pacts{margin-top:0;flex:none}
.okmail{color:#b6ff00;font-size:13px;align-self:center;margin-right:4px}
.ord.cancelled{opacity:.6}
</style>
</head>
<body>
<div class="top"><div class="logo">Retro<b>bottega</b></div><span id="stat"></span></div>
<nav class="tabs" id="tabs" hidden><button type="button" data-tab="orders">Ordini</button><button type="button" data-tab="prod">Prodotti</button><button type="button" data-tab="new">+ Nuovo</button></nav>

<section id="login">
<label class="lbl" for="pw">Password</label>
<input id="pw" class="fld" type="password" autocomplete="current-password" style="margin:6px 0 4px">
<label class="rem"><input type="checkbox" id="rem"> Ricordami su questo telefono</label>
<div id="lerr" role="alert"></div>
<button type="button" class="btn lime" id="go">Entra</button>
</section>

<main id="app" hidden>
<section id="orders" hidden>
<div id="info" class="info"></div>
<div id="testbar"></div>
<div id="todo"></div>
<div class="chips" id="ochips"></div>
<input id="oq" class="fld" type="search" aria-label="Cerca un ordine" placeholder="Cerca per nome, città, Instagram, codice, etichetta…" style="margin-bottom:12px">
<div id="prep"></div>
<div id="olist"></div>
<div id="omore"></div>
<div class="bulk" style="flex-wrap:wrap">
<button type="button" class="chip" id="oref">Aggiorna</button>
<button type="button" class="chip" id="oprep">Preparazione</button>
<button type="button" class="chip" id="ocsv">CSV della lista</button>
<button type="button" class="chip" data-csvp="day">CSV oggi</button>
<button type="button" class="chip" data-csvp="week">CSV settimana</button>
<button type="button" class="chip" data-csvp="month">CSV mese</button>
<button type="button" class="chip" id="otest">Invia avviso di prova</button>
</div>
</section>
<section id="newp" hidden>
<div id="nform"></div>
<div class="lbl" style="margin:18px 0 6px">Prodotti aggiunti dal pannello</div>
<div id="nlist"></div>
</section>
<div id="prod" hidden>
<div id="top"></div>
<div id="secs"></div>
<div id="vac"></div>
<input id="q" class="fld" type="search" aria-label="Cerca un prodotto" placeholder="Cerca un prodotto…">
<div class="chips" id="chips"></div>
<div id="list"></div>
<div class="bulk" id="bulk"></div>
</div>
</main>
<div id="toast" hidden><span>Salvato</span><button type="button" id="undo">Annulla</button></div>

<script src="config.js"></script>
<script src="products.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.SITE_CONFIG || {}, C = window.CATALOG, EP = (CFG.checkoutEndpoint || '').replace(/\/+$/, '');
  var $ = function (s) { return document.querySelector(s); };
  var pw = '', st = { closed: false, mode: 'closed', msg: '', back: '', off: [] }, prev = null, filter = 'all', q = '', saveT, toastT;
  var cats = {}; C.categories.forEach(function (c) { cats[c.id] = c.it[0]; });

  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function key(p, i) { return i === undefined ? p.id : p.id + '|' + p.variants[i].it; }
  function off(k) { return st.off.indexOf(k) > -1; }
  function anyOff(p) { return off(p.id) || (p.variants || []).some(function (v, i) { return off(key(p, i)); }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function catOff(c) { return off('cat:' + c); }   // sezione intera spenta

  // ---- comunicazione con il worker ----
  function api(method, body) {
    return fetch(EP + '/admin/state', { method: method, headers: { 'Authorization': 'Bearer ' + pw, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || 'errore'); e.status = r.status; throw e; } return j; }); });
  }
  function setStat(t, bad) { var s = $('#stat'); s.textContent = t; s.className = bad ? 'bad' : ''; }
  function hhmm() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function save(undoable) {
    render(); clearTimeout(saveT); setStat('Salvataggio…');
    saveT = setTimeout(function () {
      api('POST', st).then(function () { setStat('Salvato · ' + hhmm()); if (undoable) showToast(); })
        .catch(function (e) { setStat('NON salvato: ' + e.message, true); });
    }, 350);
  }
  function showToast() { var t = $('#toast'); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 6000); }

  // ---- accesso ----
  function login(remember) {
    $('#lerr').textContent = '';
    if (!EP) { $('#lerr').textContent = 'Manca l’indirizzo del worker in config.js.'; return; }
    api('GET').then(function (j) {
      st = { closed: !!j.closed, mode: j.mode === 'open' ? 'open' : 'closed', msg: j.msg || '', back: j.back || '', off: j.off || [] };
      try { (remember ? localStorage : sessionStorage).setItem('rb_pw', pw); } catch (e) {}
      $('#login').hidden = true; $('#app').hidden = false; render(); setStat(''); initOrders();
    }).catch(function (e) { $('#lerr').textContent = e.status === 401 ? 'Password sbagliata.' : 'Errore: ' + e.message; });
  }
  $('#go').addEventListener('click', function () { pw = $('#pw').value; login($('#rem').checked); });
  $('#pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#go').click(); });
  try { pw = sessionStorage.getItem('rb_pw') || localStorage.getItem('rb_pw') || ''; } catch (e) {}
  if (pw) login(false);

  // ---- disegno dell'interfaccia ----
  function sw(on, k, label) { return '<button type="button" class="sw' + (on ? ' on' : '') + '" data-k="' + esc(k) + '" aria-pressed="' + on + '" aria-label="' + esc(label) + '"><i></i></button>'; }
  function initials(n) { return n.split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase(); }
  function visible() {
    return C.products.filter(function (p) {
      if (filter === 'off') { if (!anyOff(p)) return false; } else if (filter !== 'all' && p.cat !== filter) return false;
      return !q || norm(p.name).indexOf(norm(q)) > -1;
    });
  }
  function row(p) {
    var o = off(p.id), vs = '', n = 0;
    if (p.variants) {
      p.variants.forEach(function (v, i) { if (!off(key(p, i))) n++; });
      vs = '<div class="vars">' + p.variants.map(function (v, i) {
        var on = !o && !off(key(p, i));
        return '<span class="vs"><button type="button" class="v' + (on ? ' on' : '') + '" data-k="' + esc(key(p, i)) + '" aria-pressed="' + on + '"' + (o ? ' disabled' : '') + '>' + esc(v.it) + '</button>' + stkInput(key(p, i)) + '</span>';
      }).join('') + '</div>';
    }
    var sub = esc(cats[p.cat] || '') + ' · ' + (catOff(p.cat) ? 'SEZIONE SPENTA · ' : '') + (o ? 'ESAURITO' : (p.variants ? n + ' su ' + p.variants.length + ' disponibili' : 'disponibile'));
    return '<div class="item' + (o ? ' offp' : '') + '"><div class="row"><div class="th">' + esc(initials(p.name)) +
      '<img alt="" src="img/prodotti/' + p.id + '.jpg" onerror="if(this.dataset.t){this.style.display=\'none\'}else{this.dataset.t=1;this.src=this.src.replace(\'.jpg\',\'.png\')}"></div>' +
      '<div class="nm">' + esc(p.name) + '<small>' + sub + '</small></div>' + sw(!o, p.id, p.name + (o ? ' esaurito' : ' disponibile')) + '</div>' + (p.variants ? vs : '<div class="vars"><span class="vs"><label class="lbl">Pezzi</label>' + stkInput(p.id) + '</span></div>') + '</div>';
  }
  function render() {
    var nOff = C.products.filter(function (p) { return off(p.id); }).length, nAny = C.products.filter(anyOff).length;
    $('#top').innerHTML = '<section class="card' + (st.closed ? ' closed' : '') + '"><div><div class="lbl">Negozio</div><div class="big">' + (st.closed ? 'IN VACANZA' : 'APERTO') +
      '</div><div class="sub">' + (st.closed ? 'Spegni l’interruttore per riaprire' : (C.products.length - nOff) + ' disponibili · ' + nOff + ' esauriti') + '</div></div>' +
      '<button type="button" class="sw' + (st.closed ? '' : ' on') + '" data-act="closed" aria-pressed="' + !st.closed + '" aria-label="Negozio aperto"><i></i></button></section>' +
      (st.closed ? '' : '<button type="button" class="btn" data-act="closed">Vai in vacanza</button>');
    $('#secs').innerHTML = '<section class="secs"><div class="lbl" style="margin-bottom:6px">Sezioni (spegne tutta la sezione in un colpo)</div>' +
      C.categories.map(function (c) { var so = catOff(c.id); return '<div class="row"><div class="nm' + (so ? ' offs' : '') + '">' + esc(c.it[0]) + '<small>' + (so ? 'SPENTA: non si compra niente' : 'accesa') + '</small></div>' + sw(!so, 'cat:' + c.id, 'Sezione ' + c.it[0] + (so ? ' spenta' : ' accesa')) + '</div>'; }).join('') + '</section>';
    $('#vac').innerHTML = !st.closed ? '' :
      '<div class="lbl" style="margin-bottom:8px">Cosa succede agli ordini?</div>' +
      '<button type="button" class="opt' + (st.mode === 'closed' ? ' sel' : '') + '" data-mode="closed" aria-pressed="' + (st.mode === 'closed') + '"><b>Chiuso del tutto</b><span>Nessun ordine: il pagamento è bloccato</span></button>' +
      '<button type="button" class="opt' + (st.mode === 'open' ? ' sel' : '') + '" data-mode="open" aria-pressed="' + (st.mode === 'open') + '"><b>Ordini aperti</b><span>Si può ordinare, spedisco dalla data scelta</span></button>' +
      '<label class="lbl" for="back">Torno / spedisco dal</label><input id="back" class="fld" type="text" placeholder="es. 15 dicembre" value="' + esc(st.back) + '" style="margin:6px 0 14px">' +
      '<label class="lbl" for="msg">Messaggio per i clienti (facoltativo)</label><textarea id="msg" class="fld" style="margin:6px 0 14px" placeholder="Siamo in vacanza! Torniamo presto.">' + esc(st.msg) + '</textarea>' +
      '<div class="lbl">Come lo vedono i clienti</div><div class="pv"><div id="pvt"></div><p>' + (st.mode === 'closed' ? 'Il carrello è chiuso fino al ritorno.' : 'Gli ordini sono aperti.') + '</p></div>';
    preview();
    var ch = [['all', 'Tutti']].concat(C.categories.map(function (c) { return [c.id, c.it[0]]; }));
    $('#chips').innerHTML = ch.map(function (c) { return '<button type="button" class="chip' + (filter === c[0] ? ' sel' : '') + '" data-f="' + c[0] + '">' + esc(c[1]) + '</button>'; }).join('') +
      '<button type="button" class="chip off' + (filter === 'off' ? ' sel' : '') + '" data-f="off">Esauriti · ' + nAny + '</button>';
    var l = visible();
    $('#list').innerHTML = l.length ? l.map(row).join('') : '<p class="sub" style="margin-top:14px">Nessun prodotto.</p>';
    $('#bulk').innerHTML = '<button type="button" class="chip" data-bulk="all">Riaccendi tutto (anche le sezioni)</button>';
  }
  function preview() { var e = $('#pvt'); if (e) e.textContent = st.msg || (st.mode === 'open' ? 'Siamo in vacanza: puoi ordinare, spediamo dal ' + (st.back || '…') + '.' : 'Siamo in vacanza! Torniamo presto.'); }

  // ---- azioni ----

      }).join('') + '</div><button type="button" class="small" data-nadd="1">+ altro prezzo</button>' +
      '<label class="lbl" for="nf-var" style="display:block;margin-top:14px">Varianti, una per riga (italiano | inglese). Lascia vuoto se non ce ne sono</label>' +
      '<textarea id="nf-var" class="fld" style="margin:6px 0 12px;height:110px" placeholder="Rosso | Red">' + esc(nf.variants) + '</textarea>' +
      '<label class="lbl" for="nf-tags">Etichette (es. nuovo, uv)</label><input id="nf-tags" class="fld" value="' + esc(nf.tags) + '" style="margin:6px 0 12px">' +
      '<label class="rem"><input type="checkbox" id="nf-letter"' + (nf.letter ? ' checked' : '') + '> Si pu\u00f2 spedire in lettera</label>' +
      '<div class="lbl">Foto da caricare</div><pre class="ph" id="nphoto">' + esc(photoHint()) + '</pre>' +
      '<div class="errbox" id="nmsg" role="alert"></div>' +
      '<button type="button" class="btn lime" data-nsave="1">' + (nf.edit ? 'Salva modifiche' : 'Salva prodotto') + '</button>' +
      (nf.edit ? '<button type="button" class="btn" data-ncancel="1">Annulla modifica</button>' : '');
    $('#nform').innerHTML = h;
    renderRes(); renderExtras();
  }
  function renderRes() {
    var e = $('#nres'); if (!e) return;
    var l = nsrcq ? C.products.filter(function (p) { return norm(p.name).indexOf(norm(nsrcq)) > -1; }).slice(0, 8) : [];
    e.innerHTML = l.map(function (p) { return '<button type="button" class="chip" data-ncopy="' + esc(p.id) + '">' + esc(p.name) + ' \u00b7 ' + esc(cats[p.cat] || '') + '</button>'; }).join('');
  }
  function renderExtras() {
    $('#nlist').innerHTML = extras.length ? extras.map(function (p) {
      return '<div class="lastx"><span>' + esc(p.name) + '<br><small style="color:#9a9a94">' + esc(p.id) + '</small></span><button type="button" class="small" data-nedit="' + esc(p.id) + '">Modifica</button><button type="button" class="small" data-ndel="' + esc(p.id) + '">Elimina</button></div>';
    }).join('') : '<p class="sub">Nessuno per ora.</p>';
  }
  function buildProduct() {
    var id = nf.id.trim().toLowerCase(), name = nf.name.trim();
    if (!name) throw new Error('Scrivi il nome.');
    if (!/^[a-z0-9][a-z0-9-]{2,59}$/.test(id)) throw new Error('Il codice deve avere almeno 3 caratteri: lettere minuscole, numeri e trattini.');
    if (C.products.some(function (p) { return p.id === id && !(nf.edit && extras.some(function (x) { return x.id === id; })); })) throw new Error('Esiste gi\u00e0 un prodotto con questo codice: cambialo.');
    var p = { id: id, name: name, cat: nf.cat, letter: nf.letter, tags: nf.tags.split(',').map(function (x) { return x.trim().toLowerCase(); }).filter(Boolean), options: [] };
    if (nf.sub) p.sub = nf.sub;
    if (nf.d0.trim() || nf.d1.trim()) p.desc = [nf.d0.trim() || nf.d1.trim(), nf.d1.trim() || nf.d0.trim()];
    var vs = parseVariants(), seen = {};
    vs.forEach(function (v) { if (v.it.indexOf('|') > -1) throw new Error('Nelle varianti non usare |.'); if (seen[v.it]) throw new Error('Variante doppia: ' + v.it); seen[v.it] = 1; });
    if (vs.length) p.variants = vs.map(function (v) { return { it: v.it, en: v.en || v.it }; });
    nf.options.forEach(function (o, i) {
      var pr = Number(String(o.price).replace(',', '.'));
      if (!(o.l0.trim() || o.l1.trim())) throw new Error('Prezzo ' + (i + 1) + ': manca il nome.');
      if (!(pr > 0 && pr <= 1000)) throw new Error('Prezzo ' + (i + 1) + ': scrivi un importo valido.');
      var r = { l: [o.l0.trim() || o.l1.trim(), o.l1.trim() || o.l0.trim()], price: Math.round(pr * 100) / 100 };
      if (nf.cat === 'stickers') { var s = Math.floor(Number(o.stk)); if (!(s >= 1)) throw new Error('Prezzo ' + (i + 1) + ': indica quanti sticker.'); r.stk = s; }
      p.options.push(r);
    });
    return p;
  }
  function postExtra(list, done) {
    setStat('Salvataggio\u2026');
    oapi('POST', '/admin/extra', { extra: list }).then(function (j) { extras = j.extra || []; applyExtra(); render(); setStat('Salvato \u00b7 ' + hhmm()); done(null); })
      .catch(function (e) { setStat('NON salvato: ' + e.message, true); done(e); });
  }
  function saveNew() {
    var p; try { p = buildProduct(); } catch (e) { $('#nmsg').textContent = e.message; return; }
    var list = nf.edit ? extras.map(function (x) { return x.id === p.id ? p : x; }) : extras.concat([p]);
    postExtra(list, function (err) { if (err) { $('#nmsg').textContent = err.message; return; } nlast = p; nf = blank(); nsrcq = ''; renderNew(); window.scrollTo(0, 0); });
  }
  function delExtra(id) {
    if (!confirm('Eliminare questo prodotto dal sito?')) return;
    postExtra(extras.filter(function (x) { return x.id !== id; }), function (err) {
      if (err) return;
      var n = st.off.length; st.off = st.off.filter(function (k) { return k !== id && k.indexOf(id + '|') !== 0; });
      if (st.off.length !== n) api('POST', st).catch(function () {});
      nlast = null; renderNew();
    });
  }
  function updPhoto() { var e = $('#nphoto'); if (e) e.textContent = photoHint(); }

  // ================= MAGAZZINO (privato: lo vedi solo qui) =================
  // Casella vuota = pezzi non contati (sempre in vendita). Numero = pezzi in magazzino:
  // a ogni ordine pagato scala da solo; a 0 il prodotto si spegne ("Esaurito" sul sito); se lo ricarichi si riaccende.
  var stockMap = {};
  function stkInput(k) {
    var has = Object.prototype.hasOwnProperty.call(stockMap, k), z = has && stockMap[k] <= 0;
    return '<input class="stk' + (has ? ' has' : '') + (z ? ' zero' : '') + '" data-s="' + esc(k) + '" inputmode="numeric" placeholder="pz" aria-label="Pezzi in magazzino" value="' + (has ? stockMap[k] : '') + '">';
  }
  function loadStock() {
    oapi('GET', '/admin/stock').then(function (j) { stockMap = j.stock || {}; render(); })
      .catch(function (e) { setStat('Magazzino non letto: ' + e.message, true); });
  }
  function saveStock(k, raw) {
    var v = String(raw).trim(), next = {}, x;
    for (x in stockMap) next[x] = stockMap[x];
    if (v === '') delete next[k];
    else { var n = Math.floor(Number(v)); if (!(n >= 0 && n <= 99999)) { setStat('Numero non valido', true); setTimeout(render, 0); return; } next[k] = n; }
    setStat('Salvataggio\u2026');
    oapi('POST', '/admin/stock', { stock: next }).then(function (j) { stockMap = j.stock || {}; if (j.off) st.off = j.off; render(); setStat('Salvato \u00b7 ' + hhmm()); })
      .catch(function (e) { setStat('NON salvato: ' + e.message, true); render(); });
  }
  document.addEventListener('change', function (e) {
    var el = e.target; if (el.hasAttribute && el.hasAttribute('data-s')) saveStock(el.getAttribute('data-s'), el.value);
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !nf && tab !== 'new') return;
    if (b.hasAttribute('data-ncopy')) { var p = C.products.filter(function (x) { return x.id === b.getAttribute('data-ncopy'); })[0]; if (p) { nf = fromProduct(p, false); nsrcq = ''; nlast = null; renderNew(); } return; }
    if (b.hasAttribute('data-nadd')) { if (nf.options.length < 6) nf.options.push({ l0: '', l1: '', price: '', stk: '' }); return renderNew(); }
    if (b.hasAttribute('data-nrm')) { if (nf.options.length > 1) nf.options.splice(+b.getAttribute('data-nrm'), 1); return renderNew(); }
    if (b.hasAttribute('data-nsave')) return saveNew();
    if (b.hasAttribute('data-ncancel')) { nf = blank(); return renderNew(); }
    if (b.hasAttribute('data-nedit')) { var x = extras.filter(function (y) { return y.id === b.getAttribute('data-nedit'); })[0]; if (x) { nf = fromProduct(x, true); nlast = null; renderNew(); window.scrollTo(0, 0); } return; }
    if (b.hasAttribute('data-ndel')) return delExtra(b.getAttribute('data-ndel'));
  });
  document.addEventListener('input', function (e) {
    var el = e.target, id = el.id || ''; if (!nf) return;
    if (id === 'nsrc') { nsrcq = el.value; return renderRes(); }
    if (id === 'nf-name') { nf.name = el.value; if (nf.idAuto && !nf.edit) { nf.id = suggestId(); $('#nf-id').value = nf.id; } return updPhoto(); }
    if (id === 'nf-id') { nf.id = el.value.toLowerCase(); nf.idAuto = false; return updPhoto(); }
    if (id === 'nf-d0') nf.d0 = el.value; if (id === 'nf-d1') nf.d1 = el.value; if (id === 'nf-tags') nf.tags = el.value;
    if (id === 'nf-var') { nf.variants = el.value; updPhoto(); }
    var o = el.getAttribute && el.getAttribute('data-o');
    if (o) { var a = o.split(':'); nf.options[+a[0]][a[1]] = el.value; }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, id = el.id || ''; if (!nf) return;
    if (id === 'nf-cat') { nf.cat = el.value; nf.sub = ''; if (nf.idAuto && !nf.edit) nf.id = suggestId(); return renderNew(); }
    if (id === 'nf-sub') nf.sub = el.value;
    if (id === 'nf-letter') nf.letter = el.checked;
  });

})();
</script>
</body>
</html>
